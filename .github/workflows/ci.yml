name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default; no job here needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # No Supabase credentials are provided, so this exercises the bundled
      # seed-corpus fallback path — which is also what a first Vercel deploy
      # runs before the backend is wired up.
      - name: Build
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Advisory only: this reports known vulnerabilities without gating the
      # merge. See the "Known advisories" section of the README.
      - name: npm audit
        run: npm audit --audit-level=high || true
